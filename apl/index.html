<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <title>ABL생명 프로젝트 가이드 메인</title>
  <link rel="stylesheet" href="apl_main.css">
  <style>
    .link-item {
      display: block;
      padding: 1.25rem;
      margin-bottom: 1rem;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      text-decoration: none;
      color: #1a1a1a;
      transition: all 0.2s ease-in-out;
    }
    .link-item:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
      transform: translateY(-2px);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }
    .link-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .link-title::after {
      content: '→';
      color: #94a3b8;
      font-size: 18px;
      transition: transform 0.2s;
    }
    .link-item:hover .link-title::after {
      transform: translateX(4px);
      color: #3b82f6;
    }
    .link-desc {
      font-size: 13px;
      color: #64748b;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="section">

    </a>

    </a>
